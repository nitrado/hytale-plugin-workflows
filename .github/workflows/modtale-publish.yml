name: Modtale Publish (Reusable)

on:
  workflow_call:
    inputs:
      artifact-id:
        description: "The artifact ID (jar name prefix)"
        type: string
        required: true
      version:
        description: "The version to publish"
        type: string
        required: true
      tag-name:
        description: "The GitHub release tag name"
        type: string
        required: true
      channel:
        description: "The Modtale channel (RELEASE|BETA|ALPHA)"
        type: string
        default: "RELEASE"
      game-versions:
        description: "Hytale game versions (comma-separated)"
        type: string
        default: "1.0-SNAPSHOT"
      changelog:
        description: "Changelog for this version"
        type: string
        default: "Automated Build & Release from GitHub"
    secrets:
      MODTALE_API_KEY:
        description: "Modtale API key for authentication"
        required: false
      MODTALE_PROJECT_ID:
        description: "Modtale project ID"
        required: false

  workflow_dispatch:
    inputs:
      channel:
        description: "The Modtale channel (RELEASE|BETA|ALPHA)"
        type: choice
        options:
          - RELEASE
          - BETA
          - ALPHA
        default: "RELEASE"
      game-versions:
        description: "Hytale game versions (comma-separated)"
        type: string
        default: "1.0-SNAPSHOT"

jobs:
  publish-modtale:
    if: ${{ github.repository != 'nitrado/hytale-plugin-workflows' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version and artifact info
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # For workflow_call, use inputs.tag-name; for workflow_dispatch, use GITHUB_REF
          if [[ -n "${{ inputs.tag-name }}" ]]; then
            TAG_NAME="${{ inputs.tag-name }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            echo "ERROR: Must be triggered on a tag (current ref: $GITHUB_REF)"
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          
          # Strip leading 'v' for version
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION from tag: $TAG_NAME"
          
          # If artifact-id is provided as input, use it
          if [[ -n "${{ inputs.artifact-id }}" ]]; then
            echo "artifact_id=${{ inputs.artifact-id }}" >> $GITHUB_OUTPUT
            echo "Using provided artifact ID: ${{ inputs.artifact-id }}"
            exit 0
          fi
          
          # Otherwise, try to detect from release assets
          ASSETS=$(gh api repos/${{ github.repository }}/releases/tags/$TAG_NAME --jq '.assets[].name' 2>/dev/null || echo "")
          
          # Find a jar file and extract artifact ID
          JAR_NAME=$(echo "$ASSETS" | grep -E "\.jar$" | grep -v "^original-" | head -n 1)
          
          if [[ -z "$JAR_NAME" ]]; then
            echo "ERROR: Could not find jar in release assets"
            echo "Available assets:"
            echo "$ASSETS"
            exit 1
          fi
          
          # Extract artifact ID by removing version suffix
          ARTIFACT_ID=$(echo "$JAR_NAME" | sed "s/-${VERSION}\.jar$//")
          echo "artifact_id=$ARTIFACT_ID" >> $GITHUB_OUTPUT
          echo "Detected artifact ID: $ARTIFACT_ID"

      - name: Fetch changelog from release
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ steps.resolve.outputs.tag_name }}"
          
          # If changelog is provided via workflow_call, use it
          if [[ -n "${{ inputs.changelog }}" && "${{ inputs.changelog }}" != "Automated Build & Release from GitHub" ]]; then
            {
              echo 'changelog<<EOF'
              echo "${{ inputs.changelog }}"
              echo 'EOF'
            } >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Otherwise, fetch from release
          RELEASE_BODY=$(gh api repos/${{ github.repository }}/releases/tags/$TAG_NAME --jq '.body // empty' 2>/dev/null || echo "")
          
          if [[ -n "$RELEASE_BODY" ]]; then
            {
              echo 'changelog<<EOF'
              echo "$RELEASE_BODY"
              echo 'EOF'
            } >> $GITHUB_OUTPUT
          else
            echo "changelog=Automated Build & Release from GitHub" >> $GITHUB_OUTPUT
          fi

      - name: Download jar from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ steps.resolve.outputs.tag_name }}"
          VERSION="${{ steps.resolve.outputs.version }}"
          ARTIFACT_ID="${{ steps.resolve.outputs.artifact_id }}"
          JAR_NAME="${ARTIFACT_ID}-${VERSION}.jar"
          
          echo "Downloading jar from release: $JAR_NAME"
          gh release download "$TAG_NAME" --repo "${{ github.repository }}" --pattern "$JAR_NAME" || {
            echo "ERROR: Failed to download $JAR_NAME from release $TAG_NAME"
            exit 1
          }
          
          echo "Downloaded files:"
          ls -la

      - name: Upload to Modtale
        env:
          MODTALE_API_KEY: ${{ secrets.MODTALE_API_KEY }}
          MODTALE_PROJECT_ID: ${{ secrets.MODTALE_PROJECT_ID }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          # Check if secrets are configured
          if [[ -z "$MODTALE_API_KEY" || -z "$MODTALE_PROJECT_ID" ]]; then
            echo "Modtale secrets not configured, skipping publish"
            exit 0
          fi
          
          VERSION="${{ steps.resolve.outputs.version }}"
          ARTIFACT_ID="${{ steps.resolve.outputs.artifact_id }}"
          JAR_PATH="./${ARTIFACT_ID}-${VERSION}.jar"
          
          if [[ ! -f "$JAR_PATH" ]]; then
            echo "ERROR: Could not find jar file at $JAR_PATH"
            ls -la
            exit 1
          fi
          
          echo "Found Jar: $JAR_PATH"
          echo "Publishing Version: $VERSION"
          echo "Game Versions: ${{ inputs.game-versions }}"
          
          # Write changelog to temp file to handle all special characters safely
          CHANGELOG_FILE=$(mktemp)
          printf '%s' "$CHANGELOG" > "$CHANGELOG_FILE"
          trap 'rm -f "$CHANGELOG_FILE"' EXIT
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.modtale.net/api/v1/projects/$MODTALE_PROJECT_ID/versions" \
            -H "X-MODTALE-KEY: $MODTALE_API_KEY" \
            -F "file=@$JAR_PATH" \
            -F "channel=${{ inputs.channel }}" \
            -F "versionNumber=$VERSION" \
            -F "gameVersions=${{ inputs.game-versions }}" \
            -F "changelog=<$CHANGELOG_FILE")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"
          
          if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 300 ]]; then
            echo "Successfully published to Modtale!"
          else
            echo "ERROR: Failed to publish to Modtale (HTTP $HTTP_CODE)"
            exit 1
          fi

